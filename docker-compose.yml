services:
  postgres:
    image: postgres:16-alpine
    container_name: healthcare_postgres
    environment:
      POSTGRES_DB: healthcare
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare -d healthcare"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: healthcare_api
    environment:
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/healthcare
      USE_DATABASE: "true"
      MART_SCHEMA: analytics
      MART_TABLE: mart_country_health_trends
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: healthcare_pipeline
    environment:
      DATABASE_URL: postgresql://healthcare:healthcare@postgres:5432/healthcare
      DBT_POSTGRES_HOST: postgres
      DBT_POSTGRES_USER: healthcare
      DBT_POSTGRES_PASSWORD: healthcare
      DBT_POSTGRES_DB: healthcare
      DBT_POSTGRES_PORT: "5432"
      DBT_POSTGRES_SCHEMA: analytics
    command: >
      sh -c "python -m src.ingestion.load_owid --write-db
      && dbt run --project-dir dbt --profiles-dir dbt
      && dbt test --project-dir dbt --profiles-dir dbt"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - pipeline

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8002
    container_name: healthcare_frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
