name: Scheduled data pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healthcare
          POSTGRES_PASSWORD: healthcare
          POSTGRES_DB: healthcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthcare -d healthcare"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://healthcare:healthcare@localhost:5432/healthcare
      USE_DATABASE: "true"
      DBT_POSTGRES_HOST: localhost
      DBT_POSTGRES_PORT: 5432
      DBT_POSTGRES_DB: healthcare
      DBT_POSTGRES_USER: healthcare
      DBT_POSTGRES_PASSWORD: healthcare
      DBT_POSTGRES_SCHEMA: analytics

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load latest source data
        run: python -m src.ingestion.load_owid --write-db

      - name: Build and test dbt mart
        run: |
          dbt run --project-dir dbt --profiles-dir dbt
          dbt test --project-dir dbt --profiles-dir dbt
